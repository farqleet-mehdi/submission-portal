name: CI

on: push

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Get the pushed code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=results.xml

      - name: Send report to local receiver
        if: always()
        run: python send_report.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Package the demo site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4